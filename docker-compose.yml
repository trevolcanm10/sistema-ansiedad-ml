version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ansiedad-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ansiedad_db
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: user
      MYSQL_PASSWORD: user123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d   # aquí puedes poner scripts .sql iniciales

volumes:
  db_data: