version: '3.8'

services:
  # ============================================================
  # Servicio de Base de Datos MySQL
  # ============================================================
  db:
    image: mysql:8.0
    container_name: ansiedad-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ansiedad_db
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: user
      MYSQL_PASSWORD: user123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Servicio de Machine Learning (Flask API)
  # ============================================================
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: ansiedad-ml
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================
  # Servicio Backend (Spring Boot)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ansiedad-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/ansiedad_db
      - DB_USERNAME=root
      - DB_PASSWORD=root123
      - JWT_SECRET=mi_clave_super_secreta_para_jwt_2026
      - JWT_EXPIRATION=1800000
      - ML_API_URL=http://ml:5000
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy

volumes:
  db_data:
